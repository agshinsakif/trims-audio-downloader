<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIMS Audio Downloader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background-color: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      text-align: center;
      font-size: 1.75rem;
      color: var(--accent-color);
    }

    .search-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-color);
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-color);
      color: #0f172a;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #log {
      margin-top: 20px;
      white-space: pre-wrap;
      background-color: #090d16;
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 8px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      max-height: 250px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>TRIMS Audio Downloader</h2>
    <div class="search-group">
      <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://www.trims.edu.az/site/resource.php?id=1455)">
      <button id="downloadBtn" onclick="process()">Download ZIP Archive</button>
    </div>
    <div id="log">Ready to process request...</div>
  </div>

  <script>
    const PROXY = "https://corsproxy.io/?";
    const BASE_DOMAIN = "https://www.trims.edu.az/site/";

    function log(msg) {
      const logDiv = document.getElementById("log");
      logDiv.textContent += msg + "\n";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function sanitizeFilename(name) {
      return name.replace(/[\\/:*?"<>|]/g, '_').trim().replace(/\.+$/, '');
    }

    async function process() {
      const logDiv = document.getElementById("log");
      const btn = document.getElementById("downloadBtn");
      logDiv.textContent = "";

      const rawUrl = document.getElementById("urlInput").value.trim();
      const idMatch = rawUrl.match(/[?&]id=(\d+)/);
      if (!idMatch) {
        log("Error: Could not extract ID from the provided URL.");
        return;
      }

      const id = idMatch[1];
      const audioUrl = `https://www.trims.edu.az/site/audio.php?id=${id}`;
      btn.disabled = true;

      try {
        log(`Fetching metadata from: ${audioUrl}...`);
        const resp = await fetch(PROXY + encodeURIComponent(audioUrl));
        const content = await resp.text();

        let matches = [];

        // Strategy 1: Flexible multiline JS object pattern
        const pattern1 = /title\s*:\s*"([^"]+)"[\s\S]*?mp3\s*:\s*"([^"]+)"/g;
        let match;
        while ((match = pattern1.exec(content)) !== null) {
          matches.push({ title: match[1], mp3: match[2] });
        }

        // Strategy 2: Fallback for mp3 defined before title multiline
        if (matches.length === 0) {
          const pattern2 = /mp3\s*:\s*"([^"]+)"[\s\S]*?title\s*:\s*"([^"]+)"/g;
          while ((match = pattern2.exec(content)) !== null) {
            matches.push({ title: match[2], mp3: match[1] });
          }
        }

        // Strategy 3: HTML download list links parsing
        if (matches.length === 0) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(content, "text/html");
          const links = doc.querySelectorAll("ul.download-track-list a");
          
          links.forEach(a => {
            const href = a.getAttribute("href");
            const title = a.textContent.trim() || a.getAttribute("download") || "track";
            if (href) {
              matches.push({ title: title, mp3: href });
            }
          });
        }

        if (matches.length === 0) {
          log("No audio tracks found on the page.");
          btn.disabled = false;
          return;
        }

        const seen = new Set();
        const uniqueTracks = [];
        for (const track of matches) {
          const cleanMp3 = track.mp3.replace(/\\\//g, '/');
          if (!seen.has(cleanMp3)) {
            seen.add(cleanMp3);
            uniqueTracks.push({ title: track.title.trim(), mp3: cleanMp3 });
          }
        }

        log(`Found ${uniqueTracks.length} unique audio tracks.`);
        log("Downloading tracks and creating ZIP archive...\n");

        const zip = new JSZip();

        for (let i = 0; i < uniqueTracks.length; i++) {
          const track = uniqueTracks[i];
          
          let fileUrl;
          if (track.mp3.startsWith("http")) {
            fileUrl = track.mp3;
          } else {
            const relativePath = track.mp3.replace(/^(\.\/|\.\.\/)+/, '');
            fileUrl = new URL(relativePath, BASE_DOMAIN).href;
          }

          let safeTitle = sanitizeFilename(track.title);
          const filename = safeTitle.toLowerCase().endsWith(".mp3") ? safeTitle : `${safeTitle}.mp3`;

          try {
            const audioResp = await fetch(PROXY + encodeURIComponent(fileUrl));
            if (!audioResp.ok) throw new Error(`HTTP ${audioResp.status}`);
            const blob = await audioResp.blob();
            zip.file(filename, blob);
            log(`[${i + 1}/${uniqueTracks.length}] Added: ${filename}`);
          } catch (e) {
            log(`[${i + 1}/${uniqueTracks.length}] Failed ${fileUrl}: ${e.message}`);
          }
        }

        log("\nGenerating ZIP file...");
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const downloadUrl = URL.createObjectURL(zipBlob);

        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = `${id}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        log(`\nDone! Downloaded ${id}.zip`);
      } catch (err) {
        log(`Error: ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
